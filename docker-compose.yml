services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: dataprocess_backend
    ports:
      - "8005:8000"
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"  #通过网关访问宿主机
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - dataprocess_network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: dataprocess_frontend
    ports:
      - "13005:13000"
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dataprocess_network

networks:
  dataprocess_network:
    driver: bridge
